name: IndexNow on push
on:
  push:
    branches: [main]

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Wait for Pages deploy to settle
        run: sleep 90
      - name: Submit changed pages to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          git diff --name-only HEAD^ HEAD -- '*.html' 'sitemap.xml' \
            | grep -v -E '^(404|avis|v38)' \
            | sed -E 's|^index\.html$||; s|^(.+\.html)$|https://stp-terrassement.com/\1|; s|^$|https://stp-terrassement.com/|; s|^sitemap\.xml$|https://stp-terrassement.com/sitemap.xml|' \
            | sort -u \
            | python scripts/submit-indexnow.py --stdin
      # L'ERP tient la file des pages a soumettre a Google (Search Console, a la main) :
      # une page nouvelle y entre en tete. Sans secrets, ou ERP injoignable : sans effet.
      - name: Annoncer les pages modifiees a l'ERP
        env:
          ERP_SITE_BASE: ${{ secrets.ERP_SITE_BASE }}
          ERP_DEPLOY_TOKEN: ${{ secrets.ERP_DEPLOY_TOKEN }}
        run: python scripts/notify-erp.py
