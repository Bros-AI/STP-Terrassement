name: SEO QA
on: [push, pull_request]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/seo-qa.py --strict
      - run: python scripts/build-feed.py --check
      - run: python scripts/build-fresh-links.py --check
